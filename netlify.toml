[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Public browser configuration and ADMIN_PATH false positives in bundled
  # dependencies are excluded; secrets scanning remains enabled for other keys.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_CONTACT_EMAIL,NEXT_PUBLIC_GOATCOUNTER,ADMIN_PATH"
